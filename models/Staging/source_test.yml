version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
  - name: stg_order_Items
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: seller_id
        tests:
          - not_null
  - name: stg_payment
    columns:
      - name: order_id
        tests:
          - not_null
      - name: payment_method
        tests:
          - accepted_values:
              values: ['credit_card', 'bank_cheque', 'debit_card', 'not_defined', 'voucher']
              




                
  - name: stg_products
    columns:
      - name: product_id
        tests:
          - not_null
  - name: stg_sellers
    columns:
      - name: seller_id
        tests:
          - not_null